<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" shape-rendering="crispEdges" role="img" aria-label="Cabana pixelada no meio da floresta">
  <!-- Chamine (pedra esverdeada) apoiada no telhado -->
  <rect x="140" y="22" width="20" height="30" fill="#8A8F7A"/>
  <rect x="136" y="16" width="28" height="8"  fill="#5C6350"/>
  <rect x="144" y="28" width="6"  height="6"  fill="#AAB39A"/>
  <!-- Telhado (terroso quente, combinando com a paleta terra e marrom) -->
  <rect x="88"  y="36" width="64" height="14" fill="#5A3D26"/>
  <rect x="72"  y="50" width="96" height="14" fill="#5A3D26"/>
  <rect x="56"  y="64" width="128" height="14" fill="#4A3220"/>
  <rect x="40"  y="78" width="160" height="14" fill="#4A3220"/>
  <rect x="24"  y="92" width="192" height="12" fill="#3A281A"/>
  <!-- Musgo no beiral (tons oliva/musgo da nova paleta) -->
  <rect x="24"  y="92" width="192" height="6" fill="#4C7A3F"/>
  <rect x="36"  y="86" width="20"  height="6" fill="#3D5A2E"/>
  <rect x="120" y="86" width="26"  height="6" fill="#3D5A2E"/>
  <rect x="180" y="88" width="18"  height="6" fill="#4C7A3F"/>
  <!-- Parede (madeira clara, mais leitura) -->
  <rect x="44" y="104" width="152" height="80" fill="#7A5636"/>
  <!-- Tabuas da parede -->
  <rect x="44" y="120" width="152" height="4" fill="#6B4A2E"/>
  <rect x="44" y="140" width="152" height="4" fill="#6B4A2E"/>
  <rect x="44" y="160" width="152" height="4" fill="#6B4A2E"/>
  <!-- Trepadeira subindo pela parede esquerda -->
  <rect x="46"  y="112" width="6" height="12" fill="#2C5B3A"/>
  <rect x="46"  y="124" width="6" height="10" fill="#3D5A2E"/>
  <rect x="48"  y="134" width="6" height="10" fill="#2C5B3A"/>
  <rect x="46"  y="144" width="6" height="8"  fill="#3D5A2E"/>
  <!-- Janela (acesa, luz dourada) -->
  <rect x="58" y="116" width="34" height="34" fill="#3A281A"/>
  <rect x="62" y="120" width="26" height="26" fill="#FFD866"/>
  <rect x="64" y="122" width="8"  height="8"  fill="#FFEFAD"/>
  <rect x="73" y="120" width="4"  height="26" fill="#3A281A"/>
  <rect x="62" y="131" width="26" height="4"  fill="#3A281A"/>
  <!-- Porta -->
  <rect x="120" y="122" width="42" height="62" fill="#3A281A"/>
  <rect x="126" y="128" width="30" height="56" fill="#5A3D26"/>
  <rect x="128" y="132" width="26" height="4"  fill="#3A281A"/>
  <rect x="128" y="152" width="26" height="4"  fill="#3A281A"/>
  <!-- Macaneta -->
  <rect x="148" y="150" width="6" height="6" fill="#FFD866"/>
  <!-- Degrau (pedra) -->
  <rect x="114" y="184" width="54" height="8" fill="#8A8F7A"/>
  <rect x="118" y="184" width="12" height="3" fill="#AAB39A"/>
  <!-- Base/chao com grama esmeralda -->
  <rect x="32" y="192" width="176" height="8" fill="#2E5B3A"/>
  <rect x="40" y="188" width="12" height="4"  fill="#57A773"/>
  <rect x="180" y="188" width="12" height="4" fill="#57A773"/>
</svg>
